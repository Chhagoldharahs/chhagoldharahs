<!DOCTYPE html>
<html lang="bn" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পেজ পাওয়া যায়নি | ছাগলধরা উচ্চ বিদ্যালয়</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top right, #05482b 0%, #003527 40%, #002019 100%);
    font-family: 'Hind Siliguri', sans-serif;
    color: #fff;
    text-align: center;
    padding: 30px 20px;
  }
  .wrap{ max-width: 480px; }
  .code{
    font-family: 'Tiro Bangla', serif;
    font-size: 6rem;
    color: #d4af37;
    line-height: 1;
    text-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  h1{
    font-family: 'Tiro Bangla', serif;
    font-size: 1.6rem;
    margin: 14px 0 10px;
  }
  p{
    color: #cbd5e1;
    font-size: 1rem;
    margin-bottom: 26px;
    line-height: 1.7;
  }
  a.btn{
    display: inline-block;
    background: linear-gradient(135deg, #d4af37 0%, #b89628 100%);
    color: #002019;
    font-weight: 700;
    padding: 12px 30px;
    border-radius: 30px;
    text-decoration: none;
    box-shadow:
      0 6px 20px rgba(212,175,55,0.35),
      9px 9px 18px rgba(0,0,0,0.45),
      -6px -6px 16px rgba(255,255,255,0.09);
  }
  a.btn:active{
    box-shadow:
      inset 5px 5px 11px rgba(0,0,0,0.45),
      inset -5px -5px 11px rgba(255,255,255,0.1);
  }
  .wrap{
    background: rgba(255,255,255,0.04);
    border-radius: 28px;
    padding: 40px 30px;
    box-shadow:
      14px 14px 28px rgba(0,0,0,0.4),
      -10px -10px 24px rgba(255,255,255,0.05);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">৪০৪</div>
    <h1>দুঃখিত, পেজটি খুঁজে পাওয়া যায়নি</h1>
    <p>আপনি যে পেজটি খুঁজছেন সেটি হয় সরিয়ে ফেলা হয়েছে, অথবা লিংকটি সঠিক নয়। প্রধান পাতায় ফিরে যেতে পারেন।</p>
    <a class="btn" href="/school.html">প্রধান পাতায় ফিরে যান</a>
  </div>
</body>
</html>
